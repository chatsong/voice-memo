<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatsong Voice Note Recorder</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #181820;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .recorder-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 18px; margin-bottom: 6px; font-weight: 600; }
        p.subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
        .timer { font-size: 32px; font-weight: 700; letter-spacing: 1px; margin-bottom: 20px; color: var(--accent); }
        .visualizer { height: 40px; display: flex; align-items: center; justify-content: center; gap: 3px; margin-bottom: 20px; }
        .bar { width: 4px; height: 8px; background: var(--border); border-radius: 2px; transition: height 0.1s ease; }
        .controls { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 8px; justify-content: center; }
        button:hover { background: var(--accent-hover); }
        button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        button.secondary:hover { background: rgba(255,255,255,0.05); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        audio { width: 100%; margin-top: 10px; border-radius: 8px; }
        .download-section { margin-top: 16px; display: none; }
        .instructions { font-size: 12px; color: var(--text-muted); margin-top: 16px; line-height: 1.4; border-top: 1px solid var(--border); padding-top: 12px; }
    </style>
</head>
<body>
    <div class="recorder-card">
        <h1>🎙️ Studio Voice Note</h1>
        <p class="subtitle">Record your behind-the-track story</p>
        
        <div class="timer" id="timer">00:00</div>
        
        <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="controls">
            <button id="recordBtn">Start Recording</button>
            <button id="stopBtn" class="secondary" disabled>Stop</button>
        </div>

        <div class="download-section" id="downloadSection">
            <audio id="audioPreview" controls></audio>
            <br><br>
            <a id="downloadBtn" download="chatsong-voicenote.webm" style="text-decoration: none;">
                <button style="width: 100%;">📥 Download Voice Note</button>
            </a>
        </div>

        <div class="instructions">
            Listen to your preview above, then download and drag it into Chatsong.
        </div>
    </div>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;
        let seconds = 0;

        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timerDisplay = document.getElementById('timer');
        const downloadSection = document.getElementById('downloadSection');
        const audioPreview = document.getElementById('audioPreview');
        const downloadBtn = document.getElementById('downloadBtn');
        const bars = document.querySelectorAll('.bar');

        recordBtn.onclick = async () => {
            audioChunks = [];
            try {
                // Vraag expliciet om microfoonrechten met optimistische instellingen voor helder geluid
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true, 
                        noiseSuppression: true,
                        autoGainControl: true 
                    } 
                });

                // Kies het beste formaat dat de browser ondersteunt
                let options = { mimeType: 'audio/webm;codecs=opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'audio/webm' };
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = {}; // Laat de browser zelf kiezen
                    }
                }

                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);

                    audioPreview.src = audioUrl;
                    downloadBtn.href = audioUrl;
                    downloadBtn.download = 'chatsong-voicenote.webm';
                    downloadSection.style.display = 'block';

                    // Direct afspelen zodat de artiest zichzelf direct hoort
                    audioPreview.play().catch(err => {
                        console.log("Autoplay prevented by browser:", err);
                    });
                };

                // Start opname en verzamel data in chunks van 100ms
                mediaRecorder.start(100);
                recordBtn.disabled = true;
                stopBtn.disabled = false;
                startTimer();
                animateVisualizer(true);

            } catch (err) {
                alert('Microphone access denied or error: ' + err.message);
                console.error(err);
            }
        };

        stopBtn.onclick = () => {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                // Stop alle microfoon streams
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            recordBtn.disabled.value = false;
            recordBtn.disabled = false;
            stopBtn.disabled = true;
            stopTimer();
            animateVisualizer(false);
        };

        function startTimer() {
            seconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                seconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }

        function animateVisualizer(active) {
            if (active) {
                window.animInterval = setInterval(() => {
                    bars.forEach(bar => {
                        bar.style.height = (Math.random() * 30 + 6) + 'px';
                    });
                }, 150);
            } else {
                clearInterval(window.animInterval);
                bars.forEach(bar => bar.style.height = '8px');
            }
        }
    </script>
</body>
</html>
