<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Voice Note</title>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #181820;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .recorder-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; }
        
        .mic-header { font-size: 38px; margin-bottom: 8px; display: inline-block; }
        h1 { font-size: 20px; margin-bottom: 6px; font-weight: 600; }
        p.subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
        
        .timer { font-size: 38px; font-weight: 700; letter-spacing: 1px; margin-bottom: 24px; color: var(--accent); }
        .visualizer { height: 36px; display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 24px; }
        .bar { width: 4px; height: 8px; background: var(--border); border-radius: 2px; transition: height 0.1s ease; }
        
        .main-btn-group { display: flex; gap: 10px; }
        button { background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; justify-content: center; width: 100%; }
        button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); width: auto; padding: 12px 20px; }
        button.secondary:hover { background: rgba(255,255,255,0.05); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        
        audio { width: 100%; margin-top: 12px; border-radius: 8px; }
        .action-section { margin-top: 20px; display: none; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .btn-success { background: #059669; }
        .btn-success:hover { background: #047857; }
        
        .hint { font-size: 12px; color: var(--text-muted); margin-top: 12px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="recorder-card">
        <div class="mic-header">🎙️</div>
        <h1>Leave a message</h1>
        <p class="subtitle">Record your story for Chatsong</p>
        
        <div class="timer" id="timer">00:00</div>
        
        <div class="visualizer" id="visualizer">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <div class="main-btn-group">
            <button id="recordBtn">Start Recording</button>
            <button id="stopBtn" class="secondary" disabled>Stop</button>
        </div>

        <div class="action-section" id="actionSection">
            <audio id="audioPreview" controls></audio>
            <br><br>
            <button id="uploadLinkBtn" class="btn-success">🔗 Copy MP3 Link</button>
            <div class="hint" id="statusHint">Click to get your direct .mp3 link for your reply!</div>
        </div>
    </div>

    <script>
        let audioContext, mediaStream, processor;
        let leftChannel = [], sampleRate = 44100;
        let timerInterval, seconds = 0;
        let mp3FileBlob = null;
        let cleanMp3Url = "";

        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timerDisplay = document.getElementById('timer');
        const actionSection = document.getElementById('actionSection');
        const audioPreview = document.getElementById('audioPreview');
        const uploadLinkBtn = document.getElementById('uploadLinkBtn');
        const statusHint = document.getElementById('statusHint');
        const bars = document.querySelectorAll('.bar');

        recordBtn.onclick = async () => {
            leftChannel = [];
            cleanMp3Url = "";
            uploadLinkBtn.textContent = "🔗 Copy MP3 Link";
            statusHint.textContent = "Click to get your direct .mp3 link for your reply!";

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
                sampleRate = audioContext.sampleRate;

                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    const channelData = e.inputBuffer.getChannelData(0);
                    const pcm = new Int16Array(channelData.length);
                    for (let i = 0; i < channelData.length; i++) {
                        let s = Math.max(-1, Math.min(1, channelData[i]));
                        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    leftChannel.push(pcm);
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

                recordBtn.disabled = true;
                stopBtn.disabled = false;
                actionSection.style.display = 'none';
                startTimer();
                animateVisualizer(true);
            } catch (err) {
                alert('Microphone access denied or unavailable.');
                console.error(err);
            }
        };

        stopBtn.onclick = () => {
            if (processor) processor.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            
            mp3FileBlob = encodeMp3(leftChannel, sampleRate);
            const localPreviewUrl = URL.createObjectURL(mp3FileBlob);

            audioPreview.src = localPreviewUrl;
            actionSection.style.display = 'block';
            audioPreview.play().catch(e => console.log("Autoplay blocked", e));

            if (audioContext && audioContext.state !== 'closed') audioContext.close();

            recordBtn.disabled = false;
            stopBtn.disabled = true;
            stopTimer();
            animateVisualizer(false);
        };

        uploadLinkBtn.onclick = async () => {
            if (!mp3FileBlob) return;

            if (cleanMp3Url) {
                copyToClipboard(cleanMp3Url);
                return;
            }

            uploadLinkBtn.disabled = true;
            uploadLinkBtn.textContent = "⏳ Uploading to Chatsong...";

            try {
                const formData = new FormData();
                formData.append('files[]', mp3FileBlob, 'voice-note.mp3');

                const response = await fetch('/api/attachments', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });

                const data = await response.json();

                // Haal de directe .mp3 URL op uit de Flarum upload response
                let extractedUrl = "";
                if (data && data.length > 0 && data[0].url) {
                    extractedUrl = data[0].url;
                } else if (data.data && data.data[0] && data.data[0].attributes) {
                    extractedUrl = data.data[0].attributes.url;
                } else if (data.data && data.data.attributes) {
                    extractedUrl = data.data.attributes.url;
                }

                if (extractedUrl) {
                    cleanMp3Url = extractedUrl;
                    copyToClipboard(cleanMp3Url);
                } else {
                    throw new Error("Invalid response format");
                }
            } catch (err) {
                alert("Upload failed. Make sure you are logged in on Chatsong.");
                uploadLinkBtn.disabled = false;
                uploadLinkBtn.textContent = "🔗 Copy MP3 Link";
                console.error(err);
            }
        };

        function copyToClipboard(url) {
            navigator.clipboard.writeText(url).then(() => {
                uploadLinkBtn.disabled = false;
                uploadLinkBtn.textContent = "✅ MP3 Link Copied!";
                statusHint.textContent = "Copied! Simply paste (Ctrl+V) the link in your reply.";
                setTimeout(() => {
                    uploadLinkBtn.textContent = "🔗 Copy MP3 Link";
                }, 3000);
            });
        }

        function encodeMp3(chunks, sampleRate) {
            const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
            const mp3Data = [];
            for (let i = 0; i < chunks.length; i++) {
                const mp3buf = mp3encoder.encodeBuffer(chunks[i]);
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(mp3buf);
            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        function startTimer() {
            seconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function updateTimerDisplay() {
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }

        function animateVisualizer(active) {
            if (active) {
                window.animInterval = setInterval(() => {
                    bars.forEach(bar => bar.style.height = (Math.random() * 30 + 6) + 'px');
                }, 150);
            } else {
                clearInterval(window.animInterval);
                bars.forEach(bar => bar.style.height = '8px');
            }
        }
    </script>
</body>
</html>
