<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatsong Voice Recorder</title>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #181820;
            --accent: #7c3aed;
            --accent-hover: #6d28d9;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .recorder-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 100%; max-width: 360px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center; }
        
        .mic-icon { font-size: 48px; margin-bottom: 12px; }
        h1 { font-size: 20px; margin-bottom: 6px; font-weight: 600; }
        p.subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
        
        .timer { font-size: 42px; font-weight: 700; letter-spacing: 1px; margin-bottom: 24px; color: var(--accent); }
        
        .controls { display: flex; flex-direction: column; gap: 12px; }
        button { background: var(--accent); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        button.stop-btn { background: #dc2626; }
        button.stop-btn:hover { background: #b91c1c; }
        button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        
        .hint { font-size: 12px; color: var(--text-muted); margin-top: 16px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="recorder-card">
        <div class="mic-icon">🎙️</div>
        <h1>Leave a message</h1>
        <p class="subtitle">Record your voice note</p>
        
        <div class="timer" id="timer">00:00</div>

        <div class="controls">
            <button id="recordBtn">🔴 Start Recording</button>
            <button id="stopBtn" class="stop-btn" style="display: none;" disabled>⏹️ Stop & Download MP3</button>
        </div>

        <div class="hint" id="statusHint">Click 'Start Recording' to begin speaking.</div>
    </div>

    <script>
        let audioContext, mediaStream, processor;
        let leftChannel = [], sampleRate = 44100;
        let timerInterval, seconds = 0;

        const recordBtn = document.getElementById('recordBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timerDisplay = document.getElementById('timer');
        const statusHint = document.getElementById('statusHint');

        recordBtn.onclick = async () => {
            leftChannel = [];
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') await audioContext.resume();
                sampleRate = audioContext.sampleRate;

                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);

                processor.onaudioprocess = (e) => {
                    const channelData = e.inputBuffer.getChannelData(0);
                    const pcm = new Int16Array(channelData.length);
                    for (let i = 0; i < channelData.length; i++) {
                        let s = Math.max(-1, Math.min(1, channelData[i]));
                        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                    }
                    leftChannel.push(pcm);
                };

                source.connect(processor);
                processor.connect(audioContext.destination);

                recordBtn.style.display = 'none';
                stopBtn.style.display = 'flex';
                stopBtn.disabled = false;
                
                startTimer();
                statusHint.textContent = "Recording in progress... Click stop when finished.";
            } catch (err) {
                alert('Microphone access denied or unavailable.');
                console.error(err);
            }
        };

        stopBtn.onclick = () => {
            if (processor) processor.disconnect();
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            
            const mp3Blob = encodeMp3(leftChannel, sampleRate);
            const url = URL.createObjectURL(mp3Blob);

            // Automatische download starten
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = `chatsong-voicenote-${Date.now()}.mp3`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            if (audioContext && audioContext.state !== 'closed') audioContext.close();

            stopBtn.style.display = 'none';
            recordBtn.style.display = 'flex';
            stopTimer();

            statusHint.textContent = "✅ MP3 downloaded! You can now upload it to Chatsong.";
        };

        function encodeMp3(chunks, sampleRate) {
            const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
            const mp3Data = [];
            for (let i = 0; i < chunks.length; i++) {
                const mp3buf = mp3encoder.encodeBuffer(chunks[i]);
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(mp3buf);
            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        function startTimer() {
            seconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
        }

        function stopTimer() { clearInterval(timerInterval); }

        function updateTimerDisplay() {
            const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
            const secs = String(seconds % 60).padStart(2, '0');
            timerDisplay.textContent = `${mins}:${secs}`;
        }
    </script>
</body>
</html>
